name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          out="dist/release-notes.md"
          mkdir -p dist
          awk -v ver="$ver" '
            BEGIN { in_section=0 }
            $0 ~ "^## \\[" ver "\\]" { in_section=1; print; next }
            $0 ~ "^## \\[" && in_section==1 { exit }
            in_section==1 { print }
          ' CHANGELOG.md > "$out"
          if ! grep -q "^## \\[$ver\\]" "$out"; then
            echo "No CHANGELOG section for version $ver" >&2
            exit 1
          fi

      - name: Create source bundles
        run: |
          mkdir -p dist
          tar -czf dist/loxalarm-${GITHUB_REF_NAME}.tar.gz \
            cmake include docs examples tests CMakeLists.txt README.md LICENSE CHANGELOG.md \
            CONTRIBUTING.md SECURITY.md .editorconfig .gitattributes .gitignore
          zip -r dist/loxalarm-${GITHUB_REF_NAME}.zip \
            cmake include docs examples tests CMakeLists.txt README.md LICENSE CHANGELOG.md \
            CONTRIBUTING.md SECURITY.md .editorconfig .gitattributes .gitignore

      - name: Build + test + install bundle
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure
          cmake --install build --prefix dist/install
          tar -czf dist/loxalarm-${GITHUB_REF_NAME}-install.tar.gz -C dist/install .
          (cd dist/install && zip -r ../loxalarm-${GITHUB_REF_NAME}-install.zip .)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release-notes.md
          files: |
            dist/loxalarm-${{ github.ref_name }}.tar.gz
            dist/loxalarm-${{ github.ref_name }}.zip
            dist/loxalarm-${{ github.ref_name }}-install.tar.gz
            dist/loxalarm-${{ github.ref_name }}-install.zip

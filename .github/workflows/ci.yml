name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DLOXALARM_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ctest --test-dir build -C Release --output-on-failure
          else
            ctest --test-dir build --output-on-failure
          fi
        shell: bash
      - name: Install smoke
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake --install build --config Release --prefix dist
          else
            cmake --install build --prefix dist
          fi
        shell: bash
      - name: Package consumer smoke (find_package)
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(loxalarm_consumer LANGUAGES C)
          find_package(loxalarm CONFIG REQUIRED)
          add_executable(consumer main.c)
          target_link_libraries(consumer PRIVATE loxalarm::loxalarm)
          EOF
          cat > consumer/main.c <<'EOF'
          #include <loxalarm/loxalarm.h>
          int main(void) { return 0; }
          EOF
          cmake -S consumer -B consumer-build -DCMAKE_PREFIX_PATH="$PWD/dist"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake --build consumer-build --config Release
          else
            cmake --build consumer-build
          fi
        shell: bash
      - name: Package consumer smoke (C++)
        run: |
          mkdir -p consumer-cxx
          cat > consumer-cxx/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(loxalarm_consumer_cxx LANGUAGES CXX)
          find_package(loxalarm CONFIG REQUIRED)
          add_executable(consumer-cxx main.cpp)
          target_link_libraries(consumer-cxx PRIVATE loxalarm::loxalarm)
          EOF
          cat > consumer-cxx/main.cpp <<'EOF'
          #include <loxalarm/loxalarm.h>
          int main() {
            lox_alarm_t alarm{};
            (void)alarm;
            return 0;
          }
          EOF
          cmake -S consumer-cxx -B consumer-cxx-build -DCMAKE_PREFIX_PATH="$PWD/dist"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake --build consumer-cxx-build --config Release
          else
            cmake --build consumer-cxx-build
          fi
        shell: bash

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (clang + sanitizers)
        env:
          CC: clang
        run: cmake -S . -B build-sanitize -DLOXALARM_ENABLE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build-sanitize -j
      - name: Test (ASan/UBSan)
        run: ctest --test-dir build-sanitize --output-on-failure

  header-selfcontained:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Header compile checks (clang)
        run: |
          cat > /tmp/header_check.c <<'EOF'
          #include <loxalarm/loxalarm.h>
          #include <loxalarm/loxalarm_single.h>
          int main(void) { return 0; }
          EOF
          clang -Iinclude -std=c99 -Wall -Wextra -Wpedantic -Werror /tmp/header_check.c -o /tmp/header_check
          cat > /tmp/header_check.cpp <<'EOF'
          #include <loxalarm/loxalarm.h>
          #include <loxalarm/loxalarm_single.h>
          int main() { lox_alarm_t alarm{}; (void)alarm; return 0; }
          EOF
          clang++ -Iinclude -std=c++17 -Wall -Wextra -Wpedantic -Werror /tmp/header_check.cpp -o /tmp/header_check_cxx
      - name: Header compile checks (gcc)
        run: |
          cat > /tmp/header_check.c <<'EOF'
          #include <loxalarm/loxalarm.h>
          int main(void) { return 0; }
          EOF
          gcc -Iinclude -std=c99 -Wall -Wextra -Wpedantic -Werror /tmp/header_check.c -o /tmp/header_check_gcc
